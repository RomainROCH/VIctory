name: Windows diagnostics candidate

on:
  push:
    branches: [ci/verify-gpu-candidate]

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.repository == 'RomainROCH/VIctory' && !github.event.repository.private
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CANDIDATE: 10c00146fc6b55ee026d5a8903c14fd93c012345
      VICTORY_WARP: '1'
      VICTORY_D3D12_WARP: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/crates/victory-formats/src/bcpack-tables.bin
      - name: Identify the candidate and build inputs
        run: |
          $head = git rev-parse HEAD
          Write-Output $head
          if ($head -ne $env:CANDIDATE) { throw 'Unexpected candidate commit' }
          [System.IO.File]::WriteAllBytes('crates/victory-formats/src/bcpack-tables.bin', [byte[]]@())
          rustc -vV
      - name: Build the Windows diagnostics executable
        run: cargo build --locked --profile diag -p victory --features diagnostics
      - name: Smoke-test the command line
        run: '& .\target\diag\victory.exe --help'
      - name: Run GPU library tests with diagnostics
        run: cargo test --locked -p victory-gpu --lib --features diagnostics -- --test-threads=1
      - name: Run shader library tests
        if: success() || failure()
        run: cargo test --locked -p victory-shader --lib -- --test-threads=1
