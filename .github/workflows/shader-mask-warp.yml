name: Joined shader mask readback on WARP

on:
  push:
    branches: [ci/shader-mask-warp]

permissions:
  contents: read

jobs:
  mask-readback:
    if: github.repository == 'RomainROCH/VIctory' && !github.event.repository.private
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VICTORY_WARP: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 8
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/crates/victory-formats/src/bcpack-tables.bin
      - name: Check both predecessors with a synthetic compute shader
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          fix = 'ebb65ea28f8341cce5c72baad1faca1e9b097b41'
          test = 'emit::valu_tests::a_joined_mask_controls_the_uav_store'
          cargo = ['cargo', 'test', '--locked', '-p', 'victory-shader', '--lib', test,
                   '--', '--exact', '--nocapture', '--color', 'never']
          sources = [Path('crates/victory-shader/src', file) for file in ['emit/lower.rs', 'structure.rs']]
          subprocess.run(['git', 'diff', '--exit-code', fix, 'HEAD', '--', *sources], check=True)
          subprocess.run(['rustc', '-vV'], check=True)
          corrected = {p: p.read_bytes() for p in sources}

          def run():
              result = subprocess.run(cargo, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout, flush=True)
              return result

          try:
              for p in sources:
                  p.write_bytes(subprocess.check_output(['git', 'show', f'{fix}^:{p.as_posix()}']))
              red = run()
              if (red.returncode != 101 or 'a lane-mask join of an untracked mask' not in red.stdout
                      or f'{test} ... FAILED' not in red.stdout):
                  raise RuntimeError('The baseline did not fail on the incoming lane mask')
          finally:
              for p, content in corrected.items():
                  p.write_bytes(content)

          green = run()
          green.check_returncode()
          if f'{test} ... ok' not in green.stdout:
              raise RuntimeError('The test did not finish')
          for wave64, threads in [(False, 8), (True, 64)]:
              for all_lanes in [False, True]:
                  for selector, compare_lane in [(0, 2), (0, threads - 1), (1, 2)]:
                      wanted = lambda lane: lane == compare_lane if selector == 0 else all_lanes
                      values = [42 if wanted(lane) else 11 for lane in range(threads)]
                      marker = (f'warp: wave64={str(wave64).lower()} uniform_all={str(all_lanes).lower()} '
                                f'selector={selector} compare_lane={compare_lane} readback={values}')
                      if marker not in green.stdout:
                          raise RuntimeError(f'Missing WARP result: {marker}')
