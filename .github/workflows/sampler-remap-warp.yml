name: Sampler table remapping on WARP

on:
  push:
    branches: [ci/sampler-remap-windows]

permissions:
  contents: read

jobs:
  capped-sampler-heap:
    if: github.repository == 'RomainROCH/VIctory' && !github.event.repository.private
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VICTORY_D3D12_WARP: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/crates/victory-formats/src/bcpack-tables.bin
      - name: Check out the failing revision with its regression fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 59ee6db3165c70de226a6a71c90ca36b279bdf1d
          path: before
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/crates/victory-formats/src/bcpack-tables.bin
      - name: Exercise State::tables on a capped sampler heap
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess

          base = 'a80eb17c4cead4e251d7ca96d1326d901dd92fe4'
          baseline = '59ee6db3165c70de226a6a71c90ca36b279bdf1d'
          fix = '4353f28d083ffa4a0cf586e54a0f11e993813735'
          test = 'descriptor::tests::remapped_sampler_tables_use_sixteen_byte_slots'
          cargo = ['cargo', 'test', '--locked', '-p', 'victory-gpu', '--lib', '--features', 'diagnostics',
                   test, '--', '--exact', '--nocapture', '--color', 'never']
          subprocess.run(['git', 'diff', '--exit-code', fix, 'HEAD', '--', 'crates'], check=True)
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, baseline], check=True)
          subprocess.run(['rustc', '-vV'], check=True)
          assert os.environ['VICTORY_D3D12_WARP'] == '1'
          before = Path('before')
          old_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=before, text=True).strip()
          if old_head != baseline:
              raise RuntimeError(f'Unexpected baseline revision {old_head}')
          for root in (before, Path('.')):
              (root / 'crates/victory-formats/src/bcpack-tables.bin').write_bytes(b'')
          red = subprocess.run(cargo, cwd=before, env={**os.environ, 'CARGO_TARGET_DIR': str((before / 'target').resolve())}, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(red.stdout, flush=True)
          expected = [f'{test} ... FAILED', 'first remapped sampler byte offset',
                      'left: [(0, 57344)]', 'right: [(0, 28672)]', '0 passed; 1 failed']
          if red.returncode != 101 or any(line not in red.stdout for line in expected):
              raise RuntimeError('Expected the old view-sized sampler byte offset from State::tables')
          green = subprocess.run(cargo, env={**os.environ, 'CARGO_TARGET_DIR': str(Path('target').resolve())}, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(green.stdout, flush=True)
          green.check_returncode()
          if f'{test} ... ok' not in green.stdout or '1 passed; 0 failed' not in green.stdout:
              raise RuntimeError('The corrected sampler regression did not run successfully')
